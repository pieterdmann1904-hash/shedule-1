<style>
  :root{
    --bg: #10130f;
    --panel: #171b15;
    --panel-2: #1d221a;
    --line: #2b3226;
    --toxic: #9fe830;
    --toxic-dim: #6b9c22;
    --amber: #f2a93b;
    --danger: #e85b4a;
    --text: #e9ecdf;
    --text-dim: #8c9484;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Oswald', sans-serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(159,232,48,0.05), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 8px),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    padding-bottom:60px;
  }
  ::selection{background:var(--toxic); color:#10130f;}
  a{color:inherit;}

  .hazard-bar{
    height:10px;
    background:repeating-linear-gradient(45deg, var(--amber), var(--amber) 14px, #1a1a1a 14px, #1a1a1a 28px);
    opacity:0.85;
  }
  header{
    padding:34px 5vw 26px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
  }
  .brand-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.25em; color:var(--toxic);
    text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  .brand-eyebrow::before{content:''; width:7px; height:7px; background:var(--toxic); border-radius:50%; box-shadow:0 0 8px var(--toxic); animation:blink 2s infinite;}
  @keyframes blink{0%,100%{opacity:1} 50%{opacity:0.25}}
  h1{
    font-family:var(--display); font-weight:700; font-size:clamp(32px,5vw,54px);
    text-transform:uppercase; letter-spacing:0.01em; line-height:0.95; cursor:pointer;
  }
  h1 span{color:var(--toxic);}
  .subtitle{color:var(--text-dim); font-size:14px; max-width:460px; margin-top:10px; line-height:1.5;}
  .header-right{display:flex; flex-direction:column; align-items:flex-end; gap:12px;}
  .disclaimer{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim); text-align:right;
    border:1px solid var(--line); padding:10px 14px; max-width:260px; line-height:1.6;
  }
  .disclaimer b{color:var(--amber);}

  .lang-switch{display:flex; gap:4px; border:1px solid var(--line); padding:3px; border-radius:20px;}
  .lang-btn{
    display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-dim);
    font-family:var(--mono); font-size:11px; letter-spacing:0.05em; padding:6px 12px; border-radius:20px;
    cursor:pointer; transition:all .12s;
  }
  .lang-btn .flag{font-size:15px; line-height:1;}
  .lang-btn:hover{color:var(--text);}
  .lang-btn.active{background:var(--toxic); color:#10130f; font-weight:700;}

  nav{
    display:flex; gap:0; border-bottom:1px solid var(--line); padding:0 5vw;
    overflow-x:auto;
  }
  nav button{
    font-family:var(--mono); font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-dim); background:none; border:none; padding:16px 18px; white-space:nowrap;
    border-bottom:2px solid transparent; transition:all .12s; cursor:pointer;
  }
  nav button:hover{color:var(--toxic); border-bottom-color:var(--toxic-dim);}
  nav button.active{color:var(--toxic); border-bottom-color:var(--toxic);}

  .search-wrap{padding:34px 5vw 10px;}
  .search-box{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    padding:14px 18px; border-radius:3px; max-width:640px;
  }
  .search-box input{
    flex:1; background:none; border:none; color:var(--text); font-family:var(--body); font-size:14px; outline:none;
  }
  .search-box input::placeholder{color:var(--text-dim);}
  .search-box .icon{color:var(--toxic); font-family:var(--mono); font-size:14px;}
  .search-hint{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:8px;}

  main{padding:10px 5vw 0;}
  .page{display:none;}
  .page.active{display:block;}

  .section-title{
    font-family:var(--mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--text-dim); margin:36px 0 16px; display:flex; align-items:center; gap:12px;

  .section-title::after{content:''; flex:1; height:1px; background:var(--line);}

  .page-intro{color:var(--text-dim); font-size:13.5px; max-width:640px; line-height:1.6; margin-top:14px;}

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line);
  }
  .card{
    background:var(--bg); padding:20px; text-decoration:none; color:var(--text);
    display:flex; flex-direction:column; gap:8px; transition:all .12s; position:relative; cursor:pointer;
    border:none; text-align:left; font-family:var(--body); width:100%;

  .card:hover{background:var(--panel-2);}
  .card:hover .card-title{color:var(--toxic);}
  .card-tag{font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--toxic-dim);}
  .card-title{font-family:var(--display); font-size:19px; text-transform:uppercase; letter-spacing:0.01em; transition:color .12s;}
  .card-desc{font-size:12.5px; color:var(--text-dim); line-height:1.5; flex:1;}
  .card-meta{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); border-top:1px solid var(--line); padding-top:10px; margin-top:2px; display:flex; justify-content:space-between; gap:8px;}
  .card-meta .val{color:var(--amber);}
  .card-tags-row{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px;}
  .mini-chip{font-family:var(--mono); font-size:9.5px; padding:3px 7px; border:1px solid var(--line); color:var(--text-dim); border-radius:20px;}

  .stat-strip{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:10px;}
  .stat{background:var(--panel); padding:18px 20px; cursor:pointer; transition:background .12s;}
  .stat:hover{background:var(--panel-2);}
  .stat .num{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--toxic);}
  .stat .lbl{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px;}

  .change-list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line);}
  .change-row{background:var(--bg); padding:13px 18px; display:flex; align-items:center; gap:14px; font-size:13px;}
  .change-row .badge{
    font-family:var(--mono); font-size:9.5px; padding:3px 8px; border-radius:20px; text-transform:uppercase;
    border:1px solid var(--toxic-dim); color:var(--toxic); flex-shrink:0;
  }
  .change-row .badge.edit{border-color:var(--line); color:var(--text-dim);}
  .change-row button{background:none; border:none; color:var(--text); text-decoration:none; flex:1; text-align:left; font-family:var(--body); font-size:13px; cursor:pointer; padding:0;}
  .change-row button:hover{color:var(--toxic);}
  .change-row .date{font-family:var(--mono); font-size:11px; color:var(--text-dim);}

  .callout{
    border:1px solid var(--toxic-dim); background:rgba(159,232,48,0.05); padding:22px 24px; margin-top:36px;

  .callout-text .eyebrow{font-family:var(--mono); font-size:10.5px; color:var(--toxic); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:6px;}
  .callout-text .title{font-family:var(--display); font-size:22px; text-transform:uppercase;}
  .callout-text p{color:var(--text-dim); font-size:13px; margin-top:6px; max-width:440px;}
  .btn-primary{

    font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    cursor:pointer; border-radius:2px; text-decoration:none; white-space:nowrap; transition:all .12s; display:inline-block;
  }
  .btn-primary:hover{background:#b6f052; box-shadow:0 0 20px rgba(159,232,48,0.3);}

  .data-table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); font-size:13px;}
  .data-table th{
    font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim);
    text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel-2);
  }
  .data-table td{padding:9px 14px; border-bottom:1px solid var(--line); color:var(--text);}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tr:hover td{background:var(--panel-2);}
  .data-table .mono{font-family:var(--mono); font-size:12px;}
  .data-table .pos{color:var(--toxic);}
  .data-table .neg{color:var(--danger);}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-top:none;}

  .rank-group{margin-bottom:22px;}
  .rank-group-title{font-family:var(--display); font-size:16px; text-transform:uppercase; color:var(--amber); margin-bottom:8px; letter-spacing:0.03em;}
  .rank-pills{display:flex; flex-wrap:wrap; gap:6px;}
  .rank-pill{
    font-family:var(--mono); font-size:11px; padding:6px 10px; border:1px solid var(--line); border-radius:20px; color:var(--text-dim);

  }
  .rank-pill.unlocks{border-color:var(--toxic-dim); color:var(--toxic); background:rgba(159,232,48,0.06);}

  .support-box{
    border:1px solid var(--amber); background:rgba(242,169,59,0.06); padding:16px 20px; margin-top:36px;
    display:flex; align-items:center; gap:14px; border-radius:3px; flex-wrap:wrap;
  }
  .support-box .icon{font-size:20px;}
  .support-box .txt{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .support-box .txt a{color:var(--amber); text-decoration:none; font-weight:700;}
  .support-box .txt a:hover{text-decoration:underline;}

  .legal-box{
    border:1px solid var(--danger); background:rgba(232,91,74,0.06); padding:18px 22px; border-radius:3px;
    display:flex; gap:14px; align-items:flex-start;
  }
  .legal-box .icon{font-size:22px; flex-shrink:0; line-height:1.2;}
  .legal-box .body-txt .title{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--danger); margin-bottom:8px; font-weight:700;}
  .legal-box .body-txt p{font-size:12.5px; color:var(--text-dim); line-height:1.6;}

  footer{
    text-align:center; padding:50px 20px 10px; color:var(--text-dim); font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em;
  }
  footer .foot-links{margin-top:10px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap;}
  footer .foot-links button{background:none; border:none; color:var(--toxic-dim); font-family:var(--mono); font-size:10.5px; cursor:pointer;}
  footer .foot-support{margin-top:14px; font-size:10.5px;}
  footer .foot-support a{color:var(--amber); text-decoration:none;}
  footer .foot-support a:hover{text-decoration:underline;}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line);}
</style>
</head>

function buildRanks(){
  const groups = ["Street Rat","Hoodlum","Peddler","Hustler","Bagman","Enforcer","Shot Caller","Block Boss","Underlord","Baron"];

  groups.forEach(group => { numerals.forEach(num => { ranks.push({level, group, label:group+" "+num}); level++; }); });

  return ranks;
}

let LANG = 'en';
let currentSection = 'home';

const SECTION_IDS = ["home","ingredients","effects","products","mixing","ranks","regions","properties","npcs","guides"];

/* ============ HELPERS ============ */
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; }
function t(){ return UI[LANG]; }

/* ============ STATIC UI ============ */
function renderStaticText(){
  document.getElementById('eyebrowHome').textContent = t().eyebrow;
  document.getElementById('subtitleText').textContent = t().subtitle;
  document.getElementById('disclaimerText').innerHTML = '<b>' + t().disclaimerB + '</b> ' + t().disclaimerText;
  document.getElementById('searchInput').placeholder = t().searchPlaceholder;
  document.getElementById('footerText').textContent = t().footerLine;
  document.getElementById('footerLegalText').textContent = t().footerLegal;
  document.getElementById('footerSupport').innerHTML = t().footerSupport + ' <a href="mailto:' + SUPPORT_EMAIL + '">' + SUPPORT_EMAIL + '</a>';
  document.getElementById('footHomeBtn').textContent = t().footHome;
  document.getElementById('footGuidesBtn').textContent = t().footGuides;
  document.getElementById('footCalcBtn').textContent = t().footCalc;
  document.getElementById('langEn').classList.toggle('active', LANG === 'en');
  document.getElementById('langDe').classList.toggle('active', LANG === 'de');

  const nav = document.getElementById('mainNav');
  nav.innerHTML = '';
  SECTION_IDS.forEach(id => {
    const btn = document.createElement('button');
    btn.textContent = t().nav[id];
    btn.dataset.id = id;
    btn.classList.toggle('active', id === currentSection);
    btn.onclick = () => goTo(id);
    nav.appendChild(btn);
  });
}

function goTo(id){
  currentSection = id;
  document.querySelectorAll('#mainNav button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + id));
  window.scrollTo({top:0, behavior:'smooth'});
}

  const T = t();
  const page = el('div','page'); page.id='page-home';

  const legal = el('div','legal-box', '<span class="icon">⚠️</span><div class="body-txt"><div class="title">'+T.legalTitle+'</div><p>'+T.legalText+'</p></div>');
  page.appendChild(legal);

  const stats = el('div','stat-strip');
  const statData = [
    {num:INGREDIENTS.length, lbl:T.statLbl.ingredients, go:'ingredients'},
    {num:Object.keys(EFFECTS).length, lbl:T.statLbl.effects, go:'effects'},
    {num:PRODUCTS.length, lbl:T.statLbl.products, go:'products'},
    {num:RANKS.length, lbl:T.statLbl.ranks, go:'ranks'},
    {num:REGIONS.length, lbl:T.statLbl.regions, go:'regions'},
  ];
  statData.forEach(s => {
    const d = el('div','stat', '<div class="num">'+s.num+'</div><div class="lbl">'+s.lbl+'</div>');
    d.onclick = () => goTo(s.go);
    stats.appendChild(d);
  });
  page.appendChild(stats);

  page.appendChild(el('div','section-title', T.startHere + ' <span class="n">[04]</span>'));
  const startGrid = el('div','card-grid');
  T.startCards.forEach(c => {

    card.onclick = () => goTo(c.go);
    startGrid.appendChild(card);
  });
  page.appendChild(startGrid);

  page.appendChild(el('div','section-title', T.recentChanges + ' <span class="n">[latest]</span>'));
  const changes = el('div','change-list');
  T.changeData.forEach(c => {
    const row = el('div','change-row', '<span class="badge '+(c.badge!=="new" && c.badge!=="neu" ? "edit":"")+'">'+c.badge+'</span><button>'+c.text+'</button><span class="date">'+c.date+'</span>');
    row.querySelector('button').onclick = () => goTo(c.go);
    changes.appendChild(row);
  });
  page.appendChild(changes);

  const callout = el('div','callout', '<div class="callout-text"><div class="eyebrow">'+T.calloutEyebrow+'</div><div class="title">'+T.calloutTitle+'</div><p>'+T.calloutText+'</p></div>');
  const btn = el('a','btn-primary', T.openCalc);
  btn.href = 'mixcalc.html';
  callout.appendChild(btn);
  page.appendChild(callout);

  return page;
}

function buildIngredients(){
  const T = t();
  const page = el('div','page'); page.id='page-ingredients';
  page.appendChild(el('div','section-title', T.nav.ingredients + ' <span class="n">['+INGREDIENTS.length+']</span>'));
  page.appendChild(el('p','page-intro', T.ingredientsIntro));
  const grid = el('div','card-grid'); grid.style.marginTop='16px';
  INGREDIENTS.forEach(ing => {
    const rank = RANKS.find(r=>r.level===ing.unlock);
    const ruleCount = Object.keys(ing.rules).length;
    const ruleChips = Object.entries(ing.rules).slice(0,4).map(([k,v])=>'<span class="mini-chip">'+k+' → '+v+'</span>').join('');
    const card = el('div','card',
      '<span class="card-tag">$'+ing.cost+' · '+(rank ? rank.label : T.unlockNA)+'</span>'+
      '<span class="card-title">'+ing.name+'</span>'+
      '<span class="card-desc">'+T.defaultEffect+' <b style="color:var(--toxic)">'+ing.def+'</b></span>'+
      '<div class="card-tags-row">'+ruleChips+(ruleCount>4?'<span class="mini-chip">+'+(ruleCount-4)+' '+T.more+'</span>':'')+'</div>'+
      '<span class="card-meta"><span>'+T.transformationRules+'</span><span class="val">'+ruleCount+'</span></span>');
    grid.appendChild(card);
  });
  page.appendChild(grid);
  return page;
}

function buildEffects(){
  const T = t();
  const page = el('div','page'); page.id='page-effects';
  page.appendChild(el('div','section-title', T.nav.effects + ' <span class="n">['+Object.keys(EFFECTS).length+']</span>'));

  table.innerHTML = '<thead><tr><th>'+T.effectTh[0]+'</th><th>'+T.effectTh[1]+'</th><th>'+T.effectTh[2]+'</th></tr></thead>';
  const tbody = el('tbody');
  Object.entries(EFFECTS).sort((a,b)=>b[1].mult-a[1].mult).forEach(([name,v]) => {
    const row = el('tr','', '<td>'+name+'</td><td class="mono pos">+'+Math.round(v.mult*100)+'%</td><td class="mono neg">'+Math.round(v.add*100)+'%</td>');
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  page.appendChild(wrap);
  return page;
}

function buildProducts(){

function buildRanksPage(){
  const T = t();
  const page = el('div','page'); page.id='page-ranks';
  page.appendChild(el('div','section-title', T.nav.ranks + ' <span class="n">['+RANKS.length+']</span>'));
  page.appendChild(el('p','page-intro', T.ranksIntro));

  const groups = {};
  RANKS.forEach(r => { (groups[r.group] = groups[r.group] || []).push(r); });

  Object.entries(groups).forEach(([groupName, ranks]) => {
    const groupBox = el('div','rank-group');
    groupBox.appendChild(el('div','rank-group-title', groupName));
    const pills = el('div','rank-pills');
    ranks.forEach(r => {
      const ingUnlocked = INGREDIENTS.filter(i => i.unlock === r.level).map(i=>i.name);
      const regionUnlocked = REGIONS.filter(reg => reg.unlockLabel.toLowerCase().includes(r.label.toLowerCase()));
      const unlocks = [...ingUnlocked, ...regionUnlocked.map(x=>x.name)];
      const pill = el('span','rank-pill' + (unlocks.length ? ' unlocks' : ''), 'Lv '+r.level+' · '+r.label+(unlocks.length ? ' — '+unlocks.join(', ') : ''));
      pills.appendChild(pill);
    });
    groupBox.appendChild(pills);
    page.appendChild(groupBox);
  });
  return page;
}

/* ============ SEARCH ============ */
function buildSearchIndex(){
  const index = [];
  INGREDIENTS.forEach(i => index.push({type:'Ingredient', name:i.name, go:'ingredients'}));
  Object.keys(EFFECTS).forEach(e => index.push({type:'Effect', name:e, go:'effects'}));
  PRODUCTS.forEach(p => index.push({type:'Base Product', name:p.name, go:'products'}));
  RANKS.forEach(r => index.push({type:'Rank', name:r.label, go:'ranks'}));
  REGIONS.forEach(r => index.push({type:'Region', name:r.name, go:'regions'}));
  PROPERTIES.forEach(p => index.push({type:'Property', name:p.name, go:'properties'}));
  NPCS.forEach(n => index.push({type:'NPC', name:n.name, go:'npcs'}));
  return index;
}
const SEARCH_INDEX = buildSearchIndex();

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const hint = document.getElementById('searchHint');
  if (!q){ hint.innerHTML = ''; return; }
  const matches = SEARCH_INDEX.filter(x => x.name.toLowerCase().includes(q)).slice(0,8);
  if (matches.length === 0){ hint.innerHTML = t().noMatches; return; }
  hint.innerHTML = t().jumpTo + ' ' + matches.map(m => '<button style="background:none;border:none;color:var(--toxic);font-family:var(--mono);font-size:10.5px;cursor:pointer;text-decoration:underline;margin-right:10px;" onclick="goTo(\'' + m.go + '\')">' + m.name + ' <span style="color:var(--text-dim)">(' + m.type + ')</span></button>').join('');
});

/* ============ RENDER ALL ============ */
function renderAll(){
  renderStaticText();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  main.appendChild(buildHome());
  main.appendChild(buildIngredients());
  main.appendChild(buildEffects());
  main.appendChild(buildProducts());
  main.appendChild(buildMixing());
  main.appendChild(buildRanksPage());
  main.appendChild(buildRegions());
  main.appendChild(buildProperties());
  main.appendChild(buildNpcs());
  main.appendChild(buildGuides());
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + currentSection));
  document.querySelectorAll('#mainNav button').forEach(b => b.classList.toggle('active', b.dataset.id === currentSection));
}

function setLang(lang){
  LANG = lang;
  renderAll();
}

/* ============ INIT ============ */
function init(){
  document.getElementById('eyebrowHome').onclick = () => goTo('home');
  document.getElementById('titleHome').onclick = () => goTo('home');
  document.getElementById('langEn').onclick = () => setLang('en');
  document.getElementById('langDe').onclick = () => setLang('de');
  renderAll();
}
init();
</script>
